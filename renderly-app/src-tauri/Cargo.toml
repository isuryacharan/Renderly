[package]
name = "renderly-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri 2 desktop app for Renderly — Phase 2 GUI MVP."
default-run = "renderly-app"
# Only the integration tests listed below; tests/fake_agent is a binary, not a test target.
autotests = false

[[test]]
name = "agent_chat"
path = "tests/agent_chat.rs"

[[test]]
name = "ollama_loop"
path = "tests/ollama_loop.rs"

[lib]
name = "renderly_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "renderly-app"
path = "src/main.rs"

# Test-only stand-in for the `claude` and `codex` CLIs (speaks their stdio protocols). Used by
# tests/agent_chat.rs; it is never bundled with the app.
[[bin]]
name = "renderly-fake-agent"
path = "tests/fake_agent/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `schema` derives JsonSchema on the Command API so the in-app `edit` tool publishes the real shape.
renderly-core = { workspace = true, features = ["schema"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
parking_lot = "0.12.5"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
rodio = { version = "0.21", default-features = false, features = ["playback", "wav"] }
tokio = { version = "1", features = ["net", "sync", "macros", "rt-multi-thread", "time", "io-util"] }
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rand = "0.8"
json-patch = "4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# In-process MCP server for the agent chat (Streamable HTTP on 127.0.0.1, bearer token).
# All MIT or Apache-2.0; hyper/http/tower are already in the tree through Tauri.
rmcp = { version = "2.1.0", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1.2.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-util = "0.7"
tower-service = "0.3"
base64 = "0.22"
# Ollama's HTTP API (agent_chat/ollama.rs). Already in the tree through renderly-core; rustls.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
