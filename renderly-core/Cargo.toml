[package]
name = "renderly-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless engine for Renderly: project model, command API, media I/O, compositing. No UI dependencies — see docs/architecture.md."

[features]
# Off by default. Links FFmpeg's libraries in-process for media probing (see
# docs/linked-ffmpeg.md). Needs FFmpeg dev libraries and libclang at build time.
linked-ffmpeg = ["dep:ffmpeg-the-third"]
# Off by default. Derives `schemars::JsonSchema` on the command API types so the app can publish
# the real `Command` schema to agents (renderly-app enables it). Not part of the wasm build.
schema = ["dep:schemars"]

[dependencies]
ab_glyph = "0.2.32"
schemars = { version = "1.2.1", optional = true, features = ["uuid1"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
wgpu = "30.0.0"
# Same version wgpu 30 builds against (already in Cargo.lock). Used to validate effect-pack
# WGSL at load time on every target; `wgsl-in` is what the wasm32 build lacks through wgpu.
naga = { version = "30.0.0", features = ["wgsl-in"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Optional in-process libav backend; only pulled in by the `linked-ffmpeg` feature.
# Probe + decode only, so only codec/format/software-scaling are enabled.
ffmpeg-the-third = { version = "=6.0.0", optional = true, default-features = false, features = ["codec", "format", "software-scaling"] }
image = "0.25.10"
json-patch = "4"
nnnoiseless = { version = "0.5.2", default-features = false }
pollster = "0.4.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
sha2 = "0.10.9"
tract-onnx = "=0.23.8"
wasmtime = "36.0.2"
wat = "1.235.0"
# .rpack archives (docs/community-store.md). Deflate via flate2 only: no zopfli, no bzip2/zstd.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"

[dev-dependencies]
