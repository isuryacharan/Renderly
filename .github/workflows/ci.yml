name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check:tokens
      - run: pnpm check:icons
      - run: pnpm test
      # Storage scenarios in a real browser (OPFS, Web Locks, BroadcastChannel); the runner has Chrome.
      - run: pnpm test:storage --browser chrome
      - run: pnpm test:editor --browser chrome
      - run: pnpm test:media --browser chrome
      - run: pnpm build
