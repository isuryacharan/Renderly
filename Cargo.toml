[workspace]
resolver = "2"
members = [
    "renderly-core",
    "renderly-cli",
    "renderly-mcp",
    "renderly-app/src-tauri",
    # wasm32-only bindings (webview preview compositor, docs/preview-webview.md P2). All of
    # its real dependencies are target-gated to wasm32, so it builds as an empty lib on the
    # native target — `cargo build/test --workspace` stays green without excluding it.
    "renderly-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/isuryacharan/Renderly"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }

renderly-core = { path = "renderly-core" }

# RNNoise denoise (audio/denoise.rs) is a hot numeric loop; unoptimised it runs ~10x realtime,
# which would make the first playback/export of a denoised clip wait noticeably in dev builds.
[profile.dev.package.nnnoiseless]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.easyfft]
opt-level = 3

# tract (ML inference, ml/runtime.rs) is just as numeric: unoptimised, one YuNet frame takes
# ~1 s instead of ~50 ms, which makes the auto-reframe tests crawl.
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
